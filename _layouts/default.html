<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ko-KR' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {%- seo -%}
  {%- feed_meta -%}
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="site-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav" aria-label="주요 메뉴">
        <a href="{{ '/#projects' | relative_url }}">프로젝트</a>
        {%- if site.data.profile.github != "" %}
        <a href="{{ site.data.profile.github }}">GitHub</a>
        {%- endif %}
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">© {{ 'now' | date: '%Y' }} {{ site.title }}</div>
  </footer>
</body>
</html>
