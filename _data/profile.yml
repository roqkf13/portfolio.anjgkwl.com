name: "정어진"            # 화면 맨 위 큰 글자 — 팀 문서의 계정표(roqkf = 정어진) 기준. TODO: 사용자 확인
role: ""                  # 이름 위 작은 글씨(예: "개발자"). 비워 두면 안 나온다 — 분야를 특정하지 않는다(사용자)
headline: "서비스를 만들고, 실제로 돌아가게 하는 데까지 챙깁니다."
# 🔴 한 분야만 맡는 사람으로 읽히지 않게, 특정 프로젝트 이야기로 채우지 않게 쓴다(사용자, 2026-09-29)
#    — 맡은 역할 · 프로젝트 이야기는 프로젝트 페이지에 둔다
intro: >-
  서버와 데이터, 웹 화면, 인프라와 문서까지 필요한 곳이면 영역을 가리지 않고 손을 댑니다.
  기능을 만드는 데서 멈추지 않고, 배포해서 실제로 돌아가고 문제가 생겨도 되살릴 수 있을 때까지 챙기며,
  내린 결정과 실패를 기록으로 남겨 다음 사람이 이어받을 수 있게 합니다.

github: ""                # 🔴 비워 둔다 — GitHub 프로필은 보여 주지 않는다(사용자, 2026-09-30). 넣으면 단추와 머리 메뉴에 생긴다
email: ""                 # 넣으면 「이메일」 단추가 생긴다

skills:
