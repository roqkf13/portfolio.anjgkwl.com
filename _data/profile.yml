# 홈 소개 칸 — 여기만 고치면 홈 첫 화면이 바뀐다.
# 비워 둔 값("")은 화면에 안 나온다.

# 🔴 이름은 넣지 않는다(사용자 결정, 2026-09-30) — 홈 제목은 headline 이 맡는다
role: ""                  # 제목 위 작은 글씨(예: "개발자"). 비워 두면 안 나온다 — 분야를 특정하지 않는다(사용자)
headline: "서비스를 만들고, 실제로 돌아가게 하는 데까지 챙깁니다."
# 🔴 한 분야만 맡는 사람으로 읽히지 않게, 특정 프로젝트 이야기로 채우지 않게 쓴다(사용자, 2026-09-29)
#    — 맡은 역할 · 프로젝트 이야기는 프로젝트 페이지에 둔다
intro: >-
  서버 · 데이터 · 웹 화면 · 인프라를 가리지 않고, 배포해서 문제가 생겨도 되살릴 수 있을 때까지 챙깁니다.
  내린 결정과 실패는 기록으로 남깁니다.

# 홈 머리의 그림(글 3 : 그림 7) — 네 단계가 시계 방향으로 돌고, 가운데가 hub. 단계는 꼭 네 개(자리가 정해져 있다)
# 🔴 해 본 것만 적는다 — 관제(모니터링)는 넣지 않는다(사용자 결정, 2026-09-30)
flow:
  - title: "만들기"
    desc: "API · DB · 화면 · 시험"
    tech: "FastAPI · PostgreSQL · Next.js"
  - title: "배포"
    desc: "컨테이너 · 시험 자동화"
    tech: "Docker · GitHub Actions"
  - title: "운영"
    desc: "터널로 공개하고 k3s 로 운영"
    tech: "k3s · Cloudflare Tunnel"
  - title: "되살리기"
    desc: "백업 하나로 전체 복구"
    tech: "깨끗한 환경에서 확인"
flow_hub:
  title: "기록"
  desc: "결정 · 실패"

github: ""                # 🔴 비워 둔다 — GitHub 프로필은 보여 주지 않는다(사용자, 2026-09-30). 넣으면 단추와 머리 메뉴에 생긴다
email: ""                 # 넣으면 「이메일」 단추가 생긴다

skills:
  - group: "백엔드"
    items: ["Python", "FastAPI", "SQLAlchemy", "Alembic", "pytest"]
  - group: "데이터"
    items: ["PostgreSQL", "pgvector", "S3 · MinIO"]
  - group: "인프라"
    # 🔴 Prometheus · Grafana(관제)는 넣지 않는다(사용자 결정, 2026-09-30)
    items: ["Docker", "Kubernetes (k3s)", "Cloudflare Tunnel", "GitHub Actions"]
  - group: "웹"
    items: ["Next.js", "React", "TypeScript"]
  - group: "그 밖"
    items: ["JWT · OAuth", "Jekyll"]

# 「해 본 일」 — 영역마다 무엇을 어디서 했는지. at 은 프로젝트 이름(experience_note 에서 풀어 준다)
# 🔴 해 본 범위만 적는다 — 「안 해 본 것」 목록은 두지 않는다(사용자, 2026-09-30)
# 🔴 수치는 원문과 대조한 것만 — 팀은 origin/main 기준, 지금 있는 파일마다 처음 넣은 사람을 이름 변경까지 따라가 센다(git log --follow)
# 🔴 개인 프로젝트의 주소는 적지 않는다(사용자 결정, 2026-09-30)
# 🔴 영수증(가계부 · OCR · 업로드)은 넣지 않는다(사용자 결정, 2026-09-30)
# 그림 7 : 글 3(사용자, 2026-09-30) — 영역마다 그림(flows: 화살표로 잇는 상자 줄 / tiles: 화살표 없는 상자 / bars: 막대 / facts: 작은 칩)과
# 한 줄(summary · at)만 보이고, items 의 문장은 「자세히」를 누르면 펼쳐진다. 그림의 말은 items 문장에서만 가져온다
experience_note: "Super-Sub 는 4명 팀 프로젝트, 개인 사본은 그 서비스를 AWS 없이 내 PC 로 옮겨 운영하는 것, 개인 프로젝트는 혼자 만들고 있는 웹 서비스입니다."
experience:
  - area: "백엔드"
    summary: "FastAPI 서버(헥사고날 구조)와 보안 요구사항"
    at: ["Super-Sub"]
    flows:
      - ["회원 · 구글 로그인", "영상 수명 주기", "분석 작업 큐", "팀 매칭 API"]
    bars:
      - { label: "DB 마이그레이션", value: 44, total: 48 }
    facts: ["토큰 폐기", "인증 요청 제한", "인증 사건 로깅"]
    items:
      - at: "Super-Sub"
        text: "FastAPI 서버를 헥사고날 구조로 세우고 회원 · 구글 로그인, 영상 분석 작업 큐, 영상 수명 주기, 팀 매칭 API 를 만들었습니다. 팀 DB 마이그레이션 48개 중 44개를 작성했습니다."
      - at: "Super-Sub"
        text: "토큰 폐기, 인증 요청 제한, 인증 사건 로깅 같은 보안 요구사항을 구현했습니다."
  - area: "인프라 · 배포"
    summary: "배포 실패를 풀고, 서비스를 AWS 없이 옮겨 운영"
    at: ["Super-Sub", "개인 사본", "개인 프로젝트"]
    flows:
      - ["Docker", "k3s", "Cloudflare 터널", "공개"]
      - ["백업 1개", "깨끗한 환경", "전체 복구"]
    facts: ["S3 접근 권한 정책", "pgvector 설치로 k3s 배포 해결", "EC2 · Vercel"]
    items:
      - at: "Super-Sub"
        text: "AWS 에서 영상 저장소(S3) 접근 권한 정책을 쓰고, 운영 서버에 pgvector 를 설치해 실패를 반복하던 k3s 배포를 풀었습니다."
      - at: "개인 사본"
        text: "팀 서비스를 AWS 없이 k3s · MinIO · Cloudflare 터널로 옮기고, 백업 하나로 전체를 되살리는 것을 깨끗한 환경에서 확인했습니다."
      - at: "개인 프로젝트"
        text: "API 를 EC2 에서 Docker Compose 로 돌려 Cloudflare 터널로 공개했고, 화면은 Vercel 로 배포했습니다."
  - area: "테스트 자동화 · CI"
    summary: "시험을 쓰고, CI 로 자동으로 돌린다"
    at: ["Super-Sub", "개인 사본", "개인 프로젝트"]
    flows:
      - ["push · PR", "CI", "백엔드 · Flutter 시험"]
      - ["공개 주소", "가입", "영상 업로드", "삭제"]
    bars:
      - { label: "시험 파일", value: 81, total: 88 }
    facts: ["실제 PostgreSQL · pgvector 로 시험", "설정 키 · 문서 경로 검증"]
    items:
      - at: "Super-Sub"
        text: "팀 백엔드 시험 파일 88개 중 81개를 작성하고, 백엔드(실제 PostgreSQL · pgvector)와 Flutter 앱 시험을 함께 도는 CI 를 처음 걸었습니다."
      - at: "개인 사본"
        text: "공개 주소만으로 가입부터 영상 업로드 · 삭제까지 확인하는 스모크 시험을 만들었습니다."
      - at: "개인 프로젝트"
        text: "설정 키 누락과 문서 속 깨진 경로를 잡아내는 검증 스크립트를 만들었습니다."
  - area: "웹 화면"
    summary: "맡은 영역 밖의 화면도 만들고, 화면 · 서버 어긋남을 양쪽에서 풀었다"
    at: ["Super-Sub", "개인 프로젝트", "이 사이트"]
    tiles: ["등급 · 레이더 차트", "관리자 영상 페이지", "화면 ⇄ 서버 결함 수정", "로그인 세션", "이 사이트 — 밝게 · 어둡게 · 폰"]
    items:
      - at: "Super-Sub"
        text: "맡은 영역 밖이었지만 분석 리포트의 등급 · 레이더 차트와 관리자 영상 페이지를 만들고, 화면과 서버가 어긋나던 결함을 양쪽을 함께 고쳐 풀었습니다."
      - at: "개인 프로젝트"
        text: "Next.js 로 로그인 세션(Authorization 헤더 방식)을 만들었습니다."
      - at: "이 사이트"
        text: "Jekyll 로 직접 만들었습니다 — 밝은 · 어두운 화면과 폰 화면을 함께 맞췄습니다."
  - area: "AI 모델을 서비스에 붙이기"
